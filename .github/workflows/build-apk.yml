name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME: ${JAVA_HOME:-}"

          JAVA_VERSION_OUTPUT="$(java -version 2>&1)"
          JAVA_MAJOR_VERSION="$(printf '%s\n' "$JAVA_VERSION_OUTPUT" | awk -F'"' '/version/ {print $2}' | awk -F'.' '{print ($1 == "1" ? $2 : $1); exit}')"

          if [ -z "$JAVA_MAJOR_VERSION" ]; then
            echo "Error: Could not detect the active Java major version."
            exit 1
          fi

          echo "Active Java major version: $JAVA_MAJOR_VERSION"

          if ! [[ "$JAVA_MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "Error: Detected Java major version is not numeric: $JAVA_MAJOR_VERSION"
            exit 1
          fi

          if [ "$JAVA_MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Active Java major version $JAVA_MAJOR_VERSION is lower than 17."
            exit 1
          fi

          echo "Java environment verified: Java $JAVA_MAJOR_VERSION is active."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Prepare persistent debug signing keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -n "${ANDROID_DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "Restoring persistent debug keystore from GitHub Actions secret."
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > ./debug.keystore
          else
            echo "WARNING: ANDROID_DEBUG_KEYSTORE_BASE64 is not configured."
            echo "Generating a temporary debug keystore for this run."
            echo "Future APK updates will require the same persistent keystore to be configured."
            "${JAVA_HOME}/bin/keytool" -genkeypair \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "Error: ./debug.keystore is missing or empty."
            exit 1
          fi

          echo "Debug signing keystore prepared."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK is missing: $EXPECTED_APK"
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK paths discovered inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' -print
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: Expected APK is empty: $EXPECTED_APK"
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "Error: Expected APK does not have the .apk extension: $EXPECTED_APK"
              exit 1
              ;;
          esac

          echo "Verified APK: $EXPECTED_APK"
          echo "APK size: $(stat -c%s "$EXPECTED_APK") bytes"

          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "Error: apksigner was not found in Android SDK build-tools."
            exit 1
          fi

          echo "Verifying APK signature with: $APKSIGNER"
          "$APKSIGNER" verify --verbose "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail

          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          REPO_RAW="${GITHUB_REPOSITORY##*/}"
          SAFE_REPO_NAME="$(printf '%s' "$REPO_RAW" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g; s/-\{2,\}/-/g; s/^-*//; s/-*$//')"

          if [ -z "$SAFE_REPO_NAME" ]; then
            echo "Error: Repository name became empty after sanitization."
            exit 1
          fi

          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TEMP_RELEASE_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "$TEMP_RELEASE_DIR"
          ASSET_PATH="${TEMP_RELEASE_DIR}/${ASSET_FILENAME}"

          cp "$EXPECTED_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Failed to prepare the release asset."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "Error: Prepared release asset is not an .apk file."
              exit 1
              ;;
          esac

          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_filename=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $ASSET_FILENAME"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_FILENAME="${{ steps.prepare_asset.outputs.asset_filename }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "Error: Prepared release asset is not an .apk file."
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES_CONTENT=$(cat <<EOF_NOTES
          This is an automatically generated debug APK.

          - Built by GitHub Actions.
          - GitHub Actions run number: ${GITHUB_RUN_NUMBER}
          - GitHub Actions run attempt: ${GITHUB_RUN_ATTEMPT}
          - Source commit SHA: ${GITHUB_SHA}
          - Intended for testing.
          - Not a Play Store production release.
          - Signed only with a temporary debug keystore.
          EOF_NOTES
          )

          echo "Creating GitHub Release: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES_CONTENT" \
            --latest

          echo "Release created successfully: $RELEASE_TAG"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "asset_filename=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          ASSET_FILENAME="${{ steps.prepare_asset.outputs.asset_filename }}"

          echo "### Build and Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **APK Build:** Succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Actions Artifact:** Succeeded (\`app-debug-apk\`)" >> "$GITHUB_STEP_SUMMARY"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "GitHub Release publishing succeeded."

            RELEASE_TAG_CONFIRMED="$(gh release view "$RELEASE_TAG" --json tagName --jq .tagName)"
            RELEASE_TITLE_CONFIRMED="$(gh release view "$RELEASE_TAG" --json name --jq .name)"
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq .url)"

            echo "Release tag: $RELEASE_TAG_CONFIRMED"
            echo "Release title: $RELEASE_TITLE_CONFIRMED"
            echo "Direct GitHub Release page URL: $RELEASE_URL"
            echo "Exact APK asset filename: $ASSET_FILENAME"

            echo "- **GitHub Release Status:** Published successfully" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag:** \`${RELEASE_TAG_CONFIRMED}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Title:** ${RELEASE_TITLE_CONFIRMED}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Asset:** \`${ASSET_FILENAME}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Download URL:** ${RELEASE_URL}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The APK can be downloaded directly from the release **Assets** section. The normal Actions artifact (\`app-debug-apk\`) is also available as a backup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing failed."
            echo "The APK build and Actions artifact upload succeeded."
            echo "Actions artifact 'app-debug-apk' remains available as the backup download."

            echo "- **GitHub Release Status:** Failed (see the Publish APK to GitHub Releases step logs)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> **Warning:** Release publishing failed, but the APK build succeeded and the Actions artifact \`app-debug-apk\` remains available in this workflow run's Artifacts section." >> "$GITHUB_STEP_SUMMARY"
          fi
